<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Analytics — Mockup v2</title>
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#0a0b10; color:#e7e7ee; font-family:'Segoe UI',system-ui,sans-serif; font-size:14px; }
  .app { display:flex; height:100vh; }
  .sidebar { width:216px; background:#0c0d13; border-right:1px solid #1b1c24; padding:24px 12px; }
  .brand { font-size:23px; font-weight:800; background:linear-gradient(100deg,#818cf8,#22d3ee); -webkit-background-clip:text; background-clip:text; color:transparent; padding:0 8px 16px; }
  .navitem { padding:10px 14px; border-radius:10px; color:#b3b4c2; margin:4px 0; cursor:pointer; }
  .navitem.on { color:#fff; font-weight:600; border:1px solid rgba(129,140,248,.35); background:linear-gradient(100deg,rgba(129,140,248,.18),rgba(34,211,238,.10)); }
  .main { flex:1; display:flex; flex-direction:column; min-width:0; }
  .header { display:flex; align-items:center; gap:10px; padding:18px 22px 14px; }
  .h-title { font-size:21px; font-weight:700; }
  .chip { font-size:12px; color:#8a8b99; background:#101117; border:1px solid #23252f; border-radius:999px; padding:2px 10px; }
  .btn { margin-left:auto; font-weight:700; font-size:14px; border-radius:10px; padding:10px 16px; border:none; cursor:pointer; color:#0a0b10; background:linear-gradient(100deg,#818cf8,#22d3ee); }
  .body { flex:1; overflow:auto; padding:0 22px 20px; }
  .card { background:#0f1016; border:1px solid #1b1c24; border-radius:12px; padding:16px; margin-bottom:16px; }
  .sec { font-size:12px; text-transform:uppercase; letter-spacing:.5px; color:#8a8b99; font-weight:700; margin:0 0 10px; display:flex; align-items:center; }
  /* KPI */
  .kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
  .kpi { background:#0f1016; border:1px solid #1b1c24; border-radius:12px; padding:14px 16px; }
  .kpi .lab { font-size:12px; color:#8a8b99; }
  .kpi .val { font-size:24px; font-weight:800; margin-top:4px; }
  .up { color:#34d399; } .down { color:#fb7185; } .muted { color:#8a8b99; }
  /* table */
  .tablewrap { background:#0f1016; border:1px solid #1b1c24; border-radius:14px; overflow:hidden; }
  table { width:100%; border-collapse:collapse; font-size:16px; }
  th { text-align:left; color:#8a8b99; font-weight:600; padding:14px 20px; font-size:13px; text-transform:uppercase; letter-spacing:.4px; }
  td { padding:18px 20px; }
  tr.alt td { background:#0e0f15; }
  .r { text-align:right; } .c { text-align:center; color:#8a8b99; }
  .search { background:#101117; border:1px solid #23252f; border-radius:10px; padding:8px 12px; font-size:14px; color:#e7e7ee; outline:none; margin-left:auto; width:220px; }
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="brand">HienNVAuto</div>
    <div class="navitem">👤 Profile</div>
    <div class="navitem">📄 Template</div>
    <div class="navitem">🎬 Get Video</div>
    <div class="navitem">📊 Queue</div>
    <div class="navitem">🗓️ Schedule</div>
    <div class="navitem on">📈 Analytics</div>
    <div class="navitem">🌐 Proxy</div>
    <div class="navitem">⚙️ Setting</div>
  </div>
  <div class="main">
    <div class="header">
      <div class="h-title">📈 Analytics</div>
      <span class="muted" style="font-size:13px">Lần cuối: 06-07 23:14</span>
      <button class="btn">⟳ Thu thập ngay</button>
    </div>
    <div class="body">
      <!-- KPI tổng quan -->
      <div class="kpis" id="kpis"></div>

      <!-- chart tổng -->
      <div class="card">
        <div class="sec">Tổng follower toàn bộ profile</div>
        <svg id="chart" viewBox="0 0 980 260" style="width:100%; max-height:280px"></svg>
      </div>

      <!-- bảng sparkline mỗi profile -->
      <div class="sec">Từng profile
        <select id="sort" onchange="table()" style="margin-left:auto;background:#101117;border:1px solid #23252f;border-radius:10px;padding:8px 12px;font-size:14px;color:#c7c8d4;outline:none;text-transform:none;letter-spacing:0;font-weight:400">
          <option value="followers">Follower cao → thấp</option>
          <option value="today">Tăng hôm nay nhiều nhất</option>
          <option value="all">Tăng 30 ngày nhiều nhất</option>
          <option value="name">Tên A → Z</option>
        </select>
        <input id="search" class="search" placeholder="🔍 Tìm profile…" oninput="table()" style="margin-left:10px" />
      </div>
      <div class="tablewrap">
        <table>
          <thead><tr>
            <th style="width:44px" class="c">#</th><th>Profile</th>
            <th>Xu hướng 30 ngày</th>
            <th class="r">Follower</th><th class="r">Hôm nay</th><th class="r">30 ngày</th>
          </tr></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script>
const N_DAYS = 30;
const dates = Array.from({length:N_DAYS},(_,i)=>`06-${String(i+1).padStart(2,'0')}`);

// Đường cong mềm (Catmull-Rom → Bézier). pts = [[x,y],...]
function smooth(pts){
  if(pts.length<2) return '';
  let d=`M ${pts[0][0]},${pts[0][1]}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C ${c1x},${c1y} ${c2x},${c2y} ${p2[0]},${p2[1]}`;
  }
  return d;
}
// 12 profile dữ liệu giả
const names = ['kiu.quc.my8','l.ngc.hng2551','t.bo.ngn40','hthint93','phm.xun.vy54','trn.c.bnh59','cao.thanh.long0','v.khnh.dip5','h.minh.an84','lm.anh.khanh6','dng.bo.ha1','ng.nh.uyn76'];
let seed=42; const rnd=()=>{seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff;};
const profiles = names.map((name,k)=>{
  let base = 300 + Math.floor(rnd()*2500);
  const data=[];
  for(let i=0;i<N_DAYS;i++){ base += Math.floor((rnd()-0.35)*60); base=Math.max(50,base); data.push(base); }
  return {name, data};
});
const fmt = n => n.toLocaleString('en-US');

// ---- KPI ----
function kpis(){
  const totLast = profiles.reduce((s,p)=>s+p.data[N_DAYS-1],0);
  const totPrev = profiles.reduce((s,p)=>s+p.data[N_DAYS-2],0);
  const dToday = totLast-totPrev;
  const up = profiles.filter(p=>p.data[N_DAYS-1]>p.data[N_DAYS-2]).length;
  const down = profiles.filter(p=>p.data[N_DAYS-1]<p.data[N_DAYS-2]).length;
  const html = [
    {lab:'Tổng follower', val:fmt(totLast)},
    {lab:'Thay đổi hôm nay', val:(dToday>=0?'<span class="up">▲ '+fmt(dToday):'<span class="down">▼ '+fmt(-dToday))+'</span>'},
    {lab:'Profile tăng', val:'<span class="up">'+up+'</span>'},
    {lab:'Profile giảm', val:'<span class="down">'+down+'</span>'},
  ].map(k=>`<div class="kpi"><div class="lab">${k.lab}</div><div class="val">${k.val}</div></div>`).join('');
  document.getElementById('kpis').innerHTML=html;
}

// ---- chart tổng ----
function chart(){
  const s = dates.map((d,i)=>({date:d, value:profiles.reduce((a,p)=>a+p.data[i],0)}));
  const W=980,H=260,padL=64,padB=26,padT=14,padR=14;
  const plotW=W-padL-padR, plotH=H-padT-padB;
  const vals=s.map(x=>x.value); let min=Math.min(...vals),max=Math.max(...vals);
  const pad=(max-min)*0.12||1; min=Math.max(0,min-pad); max+=pad;
  const n=s.length, X=i=>padL+(i/(n-1))*plotW, Y=v=>padT+plotH-((v-min)/(max-min))*plotH;
  const pts=s.map((x,i)=>[X(i),Y(x.value)]);
  const linePath=smooth(pts);
  const areaPath=`${linePath} L ${X(n-1)},${padT+plotH} L ${padL},${padT+plotH} Z`;
  let g=`<defs><linearGradient id="fill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#818cf8" stop-opacity="0.35"/><stop offset="1" stop-color="#818cf8" stop-opacity="0"/></linearGradient></defs>`;
  [min,(min+max)/2,max].forEach(v=>{g+=`<line x1="${padL}" y1="${Y(v)}" x2="${W-padR}" y2="${Y(v)}" stroke="#23252f"/><text x="${padL-8}" y="${Y(v)+4}" text-anchor="end" font-size="12" fill="#8a8b99">${fmt(Math.round(v))}</text>`;});
  [0,Math.floor((n-1)/4),Math.floor((n-1)/2),Math.floor(3*(n-1)/4),n-1].forEach(i=>{g+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" font-size="12" fill="#8a8b99">${s[i].date}</text>`;});
  g+=`<path d="${areaPath}" fill="url(#fill)"/>`;
  g+=`<path d="${linePath}" fill="none" stroke="#818cf8" stroke-width="2.5" stroke-linejoin="round"/>`;
  document.getElementById('chart').innerHTML=g;
}

// ---- sparkline ----
function spark(data){
  const W=180,H=44,p=4; const min=Math.min(...data),max=Math.max(...data);
  const X=i=>p+(i/(data.length-1))*(W-2*p), Y=v=>p+(H-2*p)-((v-(min))/((max-min)||1))*(H-2*p);
  const pts=data.map((v,i)=>[X(i),Y(v)]);
  const rising = data[data.length-1]>=data[0];
  const col = rising?'#34d399':'#fb7185';
  return `<svg width="${W}" height="${H}"><path d="${smooth(pts)}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}

// ---- table ----
function table(){
  const filter=(document.getElementById('search')?.value||'').toLowerCase();
  const sort=document.getElementById('sort')?.value||'followers';
  let rows = profiles.map(p=>{
    const last=p.data[N_DAYS-1], prev=p.data[N_DAYS-2], first=p.data[0];
    return {name:p.name, data:p.data, latest:last, dToday:last-prev, dAll:last-first};
  });
  const cmp = {
    followers:(a,b)=>b.latest-a.latest,
    today:(a,b)=>b.dToday-a.dToday,
    all:(a,b)=>b.dAll-a.dAll,
    name:(a,b)=>a.name.localeCompare(b.name)
  }[sort];
  rows.sort(cmp);
  if(filter) rows=rows.filter(r=>r.name.toLowerCase().includes(filter));
  const dchip=v=> v>0?`<span class="up">▲ ${fmt(v)}</span>`: v<0?`<span class="down">▼ ${fmt(-v)}</span>`:'<span class="muted">0</span>';
  document.getElementById('tbody').innerHTML = rows.map((r,i)=>
    `<tr class="${i%2===0?'alt':''}"><td class="c">${i+1}</td><td style="font-weight:600">${r.name}</td>`+
    `<td>${spark(r.data)}</td><td class="r">${fmt(r.latest)}</td><td class="r">${dchip(r.dToday)}</td><td class="r">${dchip(r.dAll)}</td></tr>`).join('');
}

kpis(); chart(); table();
</script>
</body>
</html>
